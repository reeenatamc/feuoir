name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches @types/node in both apps.
  NODE_VERSION: "24"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        # npm ci, not install: the lockfile is the point of running this at all.
        run: npm ci

      - name: Build the API
        # tsc over the whole Nest project, so this is the type check as much as
        # it is the build. The repository has no test suite yet; when it gets
        # one, it belongs in a second job here.
        run: npm run build:api

      - name: Build the web app
        run: npm run build:web
