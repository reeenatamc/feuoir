<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FEUOIR — transformed objects. Series 001, Loja, Ecuador." />
    <!-- Precarga del poster del hero. Se queda, pero SIN `fetchpriority="high"`,
         y las dos mitades de esa decision estan medidas.

         Que se precarga. El fondo puede ser un video, pero un video no puede ser
         nunca el LCP: lo que se pinta primero es su poster. Ese poster es lo que
         se precarga.

         Este archivo es estatico y lo que se configure en el panel no se conoce
         hasta que la API responde, asi que precargarlo es imposible desde aqui.
         El poster empaquetado, en cambio, es el valor por defecto de
         --hero-image-src en modes.css: es el que el navegador iba a pedir de
         todas formas, con o sin esta linea. La precarga no agrega una descarga,
         adelanta la que ya existia. Inyectar una segunda cuando llega la URL del
         panel seria redundante: para entonces ya se escribio el token, que
         dispara exactamente la misma peticion.

         Por que dos lineas y no una. El hero pinta un archivo distinto segun si
         monta el <video> o no, y precargar el otro son bytes que no se usan:

             con video    el <video> lleva `poster`, que es una sola URL sin
                          negociacion de formato, y el fondo se alinea con ella
                          para que el navegador pida un archivo y no dos
                          -> se pinta el WebP
             sin video    no hay `poster` que alinear y el fondo negocia formato
                          con el `@supports` de modes.css
                          -> se pinta el AVIF donde se soporte

         Lo que decide entre los dos casos es `prefers-reduced-motion`, porque es
         la unica condicion del video que se puede expresar en una consulta de
         medios; el modo de interfaz vive en localStorage y desde aqui no se ve.
         Por eso cada precarga lleva su `media` y son excluyentes: siempre se
         descarga exactamente una, y siempre la que se va a pintar.

         La misma consulta envuelve al `@supports` del AVIF en modes.css, y no es
         casualidad: si el CSS ofreciera el AVIF donde va a haber video, el
         navegador lo pediria al resolver la hoja y despues pintaria el WebP del
         `poster`. Los dos archivos, uno tirado. Al tocar uno de los dos sitios
         hay que tocar el otro.

         Antes habia una sola linea, sin `media`, y precargaba el WebP: era
         correcta mientras el corte fuera por ancho -- el telefono no montaba
         video y pintaba el AVIF, asi que ese WebP no se pintaba nunca y eran
         97 KB tirados en la carga donde mas pesan. Ahora el video se monta en
         todos los anchos (ver HERO_MOTION_QUERY) y el eje ya no es el ancho sino
         la preferencia de movimiento.

         El `type` de la precarga del AVIF no es decorativo: un navegador que no
         sepa decodificarlo se salta la precarga en vez de descargar un archivo
         que despues no puede pintar.

         Por que sin prioridad alta. Medido sobre la build de produccion a
         1,6 Mbps y 150 ms de latencia, mediana de cinco vueltas:

             precarga con fetchpriority=high   LCP 2008 ms   foto a los 2016 ms
             precarga sin fetchpriority        LCP 1856 ms   foto a los 1872 ms
             sin precarga                      LCP 1140 ms   foto a los 2374 ms

         El elemento LCP resulto ser el <h1>, no el fondo: Chrome no toma esta
         capa como candidata. Declarar la foto como maxima prioridad la pone a
         competir por el ancho de banda con el CSS y el JS que ese titular
         necesita, y sale perdiendo en las dos columnas. Sin el atributo la foto
         llega incluso antes.

         Quitar la precarga del todo da el mejor LCP, pero retrasa la foto medio
         segundo. En una portada que es la foto, ese medio segundo pesa mas que
         setecientos milisegundos de una metrica sobre un titular que se lee
         igual: el hero sin foto es superficie oscura con texto claro, no un
         hueco. -->
    <link
      rel="preload"
      as="image"
      href="/hero-poster.webp"
      media="(prefers-reduced-motion: no-preference)"
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/hero-poster.avif"
      media="(prefers-reduced-motion: reduce)"
    />
    <title>Feuoir</title>
    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
